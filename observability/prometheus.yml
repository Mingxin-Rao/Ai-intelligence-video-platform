global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: dovideo-app
    metrics_path: /actuator/prometheus
    static_configs:
      # Service name on the compose network; the container port, not APP_PORT.
      - targets: ['app:9090']
