brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true

# The address the broker advertises to the NameServer; clients then connect to it
# directly. It must be reachable FROM THE CLIENT, which is why it depends on where
# the app runs:
#   - app in Docker (the compose default): the compose service name, resolvable on
#     the bridge network.
#   - app on the host via `mvn spring-boot:run`: change this to 127.0.0.1, since the
#     broker's port is published there.
# Getting this wrong does not fail loudly at startup — the producer only discovers
# it when the first send returns "No route info of this topic".
brokerIP1 = rmqbroker