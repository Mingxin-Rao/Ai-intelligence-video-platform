server.port=9090

# ==============================
# 数据库配置 (Database)
# Database configuration
# ==============================
# Docker 的 MySQL 映射到宿主机 3307（避免与本机 3306 的 MySQL 冲突）；用 127.0.0.1 避免 localhost 的 IPv4/IPv6 歧义
# Docker MySQL is published on host port 3307 (to avoid clashing with a local MySQL on 3306); use 127.0.0.1 to avoid localhost IPv4/IPv6 ambiguity
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 【敏感信息】已替换为占位符，部署时请修改
# [Sensitive] replaced with a placeholder — change this when deploying.
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# 文件上传限制 (File Upload)
# File upload limits
# ==============================
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# ==============================
# MyBatis Plus
# ==============================
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==============================
# AI 模型配置 (DeepSeek & ASR)
# AI model configuration (DeepSeek & ASR)
# ==============================
# 【敏感信息】请去 https://cloud.siliconflow.cn/ 申请 Key
# [Sensitive] request a key at https://cloud.siliconflow.cn/
# 变量名必须保持不变，但值填入你的 Google Key
# Keep the property name unchanged, but set the value to your own Google key.
ai.deepseek.api-key=AIzaSyC9NlLCdzmhQ2N9o06wX0LqtbMBynqm1ek

# URL 必须改为 Google 的 OpenAI 兼容接口地址
# The URL must point to Google's OpenAI-compatible endpoint.
ai.deepseek.model-name=gemma-3-1b-it
# 没用到的可以删掉或留空
# Unused entries can be removed or left blank.
ai.aliyun.api-key=

# ==============================
# Redis (Cache & Lock)
# ==============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# ==============================
# MinIO (Object Storage)
# ==============================
minio.endpoint=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.bucketName=media

# ==============================
# 外部工具路径 (External Tools)
# External tool paths
# ==============================
# 【注意】部署前请修改为你的实际路径
# [Note] change these to your actual paths before deploying.
# Windows 示例 | Windows example: D:/ffmpeg/bin
# Linux 示例 | Linux example: /usr/bin/ffmpeg
# Windows 示例 | Windows example: D:/yt-dlp/yt-dlp.exe
# Linux 示例 | Linux example: /usr/local/bin/yt-dlp
tool.ffmpeg.dir=/opt/homebrew/bin
tool.ytdlp.path=/opt/homebrew/bin/yt-dlp


# ==============================
# RocketMQ (Message Queue)
# ==============================
rocketmq.name-server=127.0.0.1:9876
rocketmq.producer.group=video-analysis-group
rocketmq.producer.send-message-timeout=3000
