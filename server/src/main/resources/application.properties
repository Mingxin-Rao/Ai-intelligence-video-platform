server.port=9090

# =============================================================================
# Every environment-specific value below is injected as ${VAR:default}.
# The default is the local (host) setup, so `mvn spring-boot:run` works with no
# env vars set; docker-compose overrides the hosts to service names. Secrets
# have NO default and must come from the environment / .env — never commit them.
# =============================================================================

# ==============================
# Database configuration
# ==============================
# Locally MySQL is published on host port 3307 (to avoid clashing with a local MySQL
# on 3306); inside Docker the app talks to mysql:3306 on the compose network.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# File upload limits
# ==============================
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# ==============================
# MyBatis Plus
# ==============================
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==============================
# AI models (Gemini summary + OpenAI transcript)
# ==============================
# [Secret] Gemini (Google AI Studio) API key — set GEMINI_API_KEY in .env, never here.
ai.gemini.api-key=${GEMINI_API_KEY:}
# Gemini model (must support audio)
ai.gemini.model-name=${GEMINI_MODEL:gemini-3-flash-preview}

# ------------------------------
# OpenAI speech-to-text (used by "Extract Text")
# Fill in your OpenAI key (sk-...)
# ------------------------------
ai.openai.api-key=${OPENAI_API_KEY:}
# Can point at any OpenAI-compatible provider
ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
ai.openai.transcribe-model=${OPENAI_TRANSCRIBE_MODEL:whisper-1}

# ==============================
# Authentication (JWT)
# ==============================
# [Secret] server secret used to sign/verify login tokens — set JWT_SECRET in .env.
auth.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-string}
# Token validity in ms, default 7 days
auth.jwt.expire-ms=${JWT_EXPIRE_MS:604800000}

# ==============================
# Redis (Cache & Lock)
# ==============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# ==============================
# MinIO (Object Storage)
# ==============================
# NOTE: file_path URLs built from this endpoint are consumed server-side only
# (FFmpeg + the download endpoint), so pointing it at the internal service name
# inside Docker is safe — the browser never fetches these URLs directly.
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY:minioadmin}
minio.secretKey=${MINIO_SECRET_KEY:minioadmin}
minio.bucketName=${MINIO_BUCKET:media}

# ==============================
# External tool paths
# ==============================
# Defaults target macOS/Homebrew; the Docker image sets FFMPEG_DIR=/usr/bin and
# YTDLP_PATH=/usr/local/bin/yt-dlp. Windows example: D:/ffmpeg/bin
tool.ffmpeg.dir=${FFMPEG_DIR:/opt/homebrew/bin}
tool.ytdlp.path=${YTDLP_PATH:/opt/homebrew/bin/yt-dlp}


# ==============================
# RocketMQ (Message Queue)
# ==============================
rocketmq.name-server=${ROCKETMQ_NAMESERVER:127.0.0.1:9876}
rocketmq.producer.group=video-analysis-group
rocketmq.producer.send-message-timeout=3000

# ==============================
# Actuator (health probe for container orchestration)
# ==============================
# Exposes /actuator/health, used by the compose healthcheck and readiness gating.
# NOTE: unauthenticated in this dev setup — restrict or move to a separate port
# before exposing publicly.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
