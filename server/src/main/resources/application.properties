server.port=9090

# ==============================
# Database configuration
# ==============================
# Docker MySQL is published on host port 3307 (to avoid clashing with a local MySQL on 3306); use 127.0.0.1 to avoid localhost IPv4/IPv6 ambiguity
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
# [Sensitive] replaced with a placeholder — change this when deploying.
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# File upload limits
# ==============================
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# ==============================
# MyBatis Plus
# ==============================
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==============================
# AI models (Gemini summary + OpenAI transcript)
# ==============================
# [Sensitive] Gemini (Google AI Studio) API key
ai.gemini.api-key=AIzaSyC9NlLCdzmhQ2N9o06wX0LqtbMBynqm1ek
# Gemini model (must support audio)
ai.gemini.model-name=gemini-3-flash-preview

# ------------------------------
# OpenAI speech-to-text (used by "Extract Text")
# Fill in your OpenAI key (sk-...)
# ------------------------------
ai.openai.api-key=
# Can point at any OpenAI-compatible provider
ai.openai.base-url=https://api.openai.com/v1
ai.openai.transcribe-model=whisper-1

# ==============================
# Authentication (JWT)
# ==============================
# [Change this] server secret used to sign/verify login tokens — use a long random string
auth.jwt.secret=change-me-to-a-long-random-secret-string
# Token validity in ms, default 7 days
auth.jwt.expire-ms=604800000

# ==============================
# Redis (Cache & Lock)
# ==============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# ==============================
# MinIO (Object Storage)
# ==============================
minio.endpoint=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.bucketName=media

# ==============================
# External tool paths
# ==============================
# [Note] change these to your actual paths before deploying.
# Windows example: D:/ffmpeg/bin
# Linux example: /usr/bin/ffmpeg
# Windows example: D:/yt-dlp/yt-dlp.exe
# Linux example: /usr/local/bin/yt-dlp
tool.ffmpeg.dir=/opt/homebrew/bin
tool.ytdlp.path=/opt/homebrew/bin/yt-dlp


# ==============================
# RocketMQ (Message Queue)
# ==============================
rocketmq.name-server=127.0.0.1:9876
rocketmq.producer.group=video-analysis-group
rocketmq.producer.send-message-timeout=3000
